name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Syntax check
        run: |
          for file in index.js lib/*.js; do
            node --check "$file"
          done

      # The suites are self-contained: the fixture, symbol, tar and pre-install
      # suites build everything they need in a temp directory (the pre-install one
      # serves a synthetic registry over loopback), so they run in full on CI. Only
      # the cross-validation against node-semver and the live-machine assertions in
      # audit.test.mjs degrade when there is no dsh checkout.
      - name: Test
        run: pnpm test

      - name: Pack tarball
        run: pnpm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # `pnpm pack` names the file after the package name with the scope
          # folded in: @hubaking/dsh-community-plugins -> hubaking-dsh-community-plugins-<version>.tgz.
          # Match on the version instead of hardcoding the scope, so renaming
          # the package cannot silently produce "no matches found".
          TARBALL=$(ls ./*-"${TAG#v}".tgz 2>/dev/null | head -n 1)
          if [ -z "$TARBALL" ]; then
            echo "no tarball matching *-${TAG#v}.tgz in $(pwd):" >&2
            ls -la >&2
            exit 1
          fi
          sed "s|__VERSION__|${TAG}|g" .github/release-notes.md > /tmp/release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            "$TARBALL"

      # Publishes as @hubaking/dsh-community-plugins. The unscoped
      # `dsh-community-plugins` on npm belongs to a different project
      # (funcodingdev) — never publish without the scope.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public
        if: env.NODE_AUTH_TOKEN != ''
