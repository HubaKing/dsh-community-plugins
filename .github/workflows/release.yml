name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Syntax check
        run: |
          for file in index.js lib/*.js; do
            node --check "$file"
          done

      # The suites degrade gracefully on a CI box: cross-validation against
      # node-semver and the live-audit assertions skip when there is no dsh
      # checkout, while the explicit assertions and the plugin contract still run.
      - name: Test
        run: pnpm test

      - name: Pack tarball
        run: pnpm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: >-
            ## dsh-community-plugins ${{ github.ref_name }}

            为 DeepSeek Harness 提供社区插件生态指南的 bundle 插件：注册 `dsh-community-plugins` skill，并注册 `dsh_plugin_audit` 工具，把已装插件的 peer 区间、官方包引用、slot 契约与服务注入逐条比对到本机 dsh 构建。纯 JavaScript、单一依赖、无构建步骤、无 UI。

            ### 本版要点

            - 新增 `dsh_plugin_audit` 工具：**离线**完成兼容性核查，不联网、无遥测、不存快照
            - 修正 skill 中 rc 预发布 semver 判定的**事实错误**：`^0.1.0-rc.5` **不匹配** `0.1.5-rc.1`
            - 修正索引数据路径（`data/plugins/<owner>__<repo>.yml`，非 `data/plugins.json`）与 `/readme` 端点静默截断的坑
            - 补上此前遗漏的自动化审计通道与最新市场实况
            - `inject` 仍为 `['skills']`；没有 `tools` 服务的部署上工具静默降级，skill 始终可用

            ### 安装

            ```bash
            # 方式 1：npm（推荐，纯 JS 无构建脚本）
            dsh plugin --profile web add @hubaking/dsh-community-plugins

            # 方式 2：GitHub 直装
            dsh plugin --profile web add github:HubaKing/dsh-community-plugins

            # 方式 3：tarball（可离线）
            curl -LO https://github.com/HubaKing/dsh-community-plugins/releases/download/${{ github.ref_name }}/dsh-community-plugins-${{ github.ref_name }}.tgz
            dsh plugin --profile web add ./dsh-community-plugins-${{ github.ref_name }}.tgz

            # 方式 4：源码 + link（开发模式，修改即时生效）
            git clone https://github.com/HubaKing/dsh-community-plugins.git "${DSH_HOME:-~/.dsh}/plugins/dsh-community-plugins"
            dsh plugin --profile web add link:"${DSH_HOME:-~/.dsh}/plugins/dsh-community-plugins"
            ```

            > `dsh` 不在 PATH 时：`node <dsh 安装根>/apps/cli/lib/bin.js plugin --profile web add <spec>`

            > **npm 形态必须带 `@hubaking/` scope**：无 scope 的同名包属于另一个项目（funcodingdev），`add dsh-community-plugins` 会装错。

            ### 使用

            1. 安装后**重启 dsh**（bundle 层在启动时组合；改 `index.js` / `lib/` 必须重启）
            2. 新开一个会话，`<available_skills>` 出现 `dsh-community-plugins`、工具列表出现 `dsh_plugin_audit` 即生效
            3. 升级 dsh 前先问：「升级后我装的插件哪些会坏？」——agent 会调用 `dsh_plugin_audit` 逐条比对

            ### 验证

            - `${DSH_HOME:-~/.dsh}/profiles/web/package.json` 的 `dsh.profile.bundles` 含包名
            - 会话 skill 目录出现本 skill
            - `dsh_plugin_audit({})` 返回本机全部第三方插件的结论

            ### 文档

            - README 中英双语（English / 中文），语言切换栏在文档顶部
            - 官方文档：[打包与安装插件](https://deepseek-harness.github.io/deepseek-harness/develop/basic/publish) · [生命周期](https://deepseek-harness.github.io/deepseek-harness/develop/framework/)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # `pnpm pack` names the file after the package name with the scope
          # folded in: @hubaking/dsh-community-plugins -> hubaking-dsh-community-plugins-<version>.tgz.
          # Match on the version instead of hardcoding the scope, so renaming
          # the package cannot silently produce "no matches found".
          TARBALL=$(ls ./*-"${TAG#v}".tgz 2>/dev/null | head -n 1)
          if [ -z "$TARBALL" ]; then
            echo "no tarball matching *-${TAG#v}.tgz in $(pwd):" >&2
            ls -la >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$RELEASE_NOTES" \
            "$TARBALL"

      # Publishes as @hubaking/dsh-community-plugins. The unscoped
      # `dsh-community-plugins` on npm belongs to a different project
      # (funcodingdev) — never publish without the scope.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public
        if: env.NODE_AUTH_TOKEN != ''
