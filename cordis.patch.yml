# dsh-community-plugins bundle: registers the packaged `skills/<name>/SKILL.md`
# bundle on ctx.skills so every session on this deployment sees the community
# plugin guide, and — when the deployment composes a `tools` service — attaches
# the `dsh_plugin_audit` host tool that checks installed plugins against this
# machine's dsh build. Applied after @deepseek-ai/dsh-base, which already mounts
# the skill registry, the model-facing skill loader, and the tool runtime.
- insert:
    - id: dsh-community-plugins
      name: '@hubaking/dsh-community-plugins'
